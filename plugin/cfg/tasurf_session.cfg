// TASurf local session. The plugin runs it at the start of every map (tas_session_cfg 1, the default), after the
// server's own configs, so nobody has to; `exec tasurf_session` runs it by hand.
// Copied to cstrike/cfg/ by `python -m tasurf install` and by the desktop app's Launch.
// Keeps the round machinery out of the way; a round restart respawns you and aborts a run.

// No AI bots. TASurf then adds its own replay bot (named TAS) to your team a few seconds
// after you've joined one; runs and previews play on it (tas_bot 0: on you instead).
bot_quota 0
bot_kick
mp_freezetime 0
mp_timelimit 0
mp_roundtime 9          // CS:S caps the round time; if a round ends mid-run the run aborts, just run again
mp_limitteams 0
mp_autoteambalance 0
mp_autokick 0           // no idle kicks while you're in the editor (the plugin also holds it at 0: tas_no_kick)

// Movement settings the example timeline expects (surf defaults on many servers).
// Your own timelines declare their own; tas_applysettings sets them from the loaded timeline.
sv_airaccelerate 150
sv_gravity 800
sv_maxvelocity 3500
sv_enablebunnyhopping 1  // 0 (CS:S's default) cuts your speed to 1.1 x maxspeed (275-286 u/s) on every jump

// Keep the game running at full speed while you're alt-tabbed in the editor
// (the default sleeps 50 ms per frame when the window isn't focused).
engine_no_focus_sleep 0

echo "tasurf_session.cfg executed"
